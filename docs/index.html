<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoKwik Partnership Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:     #6C3CE1;
      --brand-dk:  #4e28b8;
      --accent:    #FF6B35;
      --bg:        #F4F6FC;
      --card:      #ffffff;
      --text:      #1A1A2E;
      --muted:     #64748b;
      --border:    #e2e8f0;
      --tag-bg:    #EDE9FF;
      --tag-fg:    #5b21b6;
      --radius:    12px;
      --shadow:    0 2px 12px rgba(108,60,225,.08);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dk) 100%);
      color: #fff;
      padding: 0 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(108,60,225,.3);
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 1rem;
      height: 64px;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .logo span { color: #FFD166; }
    .header-sub {
      font-size: .8rem;
      opacity: .75;
      margin-left: auto;
    }

    /* ── Main layout ── */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* ── Stats row ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow);
      border-left: 4px solid var(--brand);
    }
    .stat-card .val {
      font-size: 2rem;
      font-weight: 800;
      color: var(--brand);
      line-height: 1;
    }
    .stat-card .lbl {
      font-size: .78rem;
      color: var(--muted);
      margin-top: .3rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .stat-card:nth-child(2) { border-color: var(--accent); }
    .stat-card:nth-child(2) .val { color: var(--accent); }
    .stat-card:nth-child(3) { border-color: #10b981; }
    .stat-card:nth-child(3) .val { color: #10b981; }
    .stat-card:nth-child(4) { border-color: #3b82f6; }
    .stat-card:nth-child(4) .val { color: #3b82f6; }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: .75rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      align-items: center;
    }
    .search-wrap {
      flex: 1;
      min-width: 220px;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: .65rem 1rem .65rem 2.5rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: .92rem;
      outline: none;
      background: var(--card);
      transition: border .2s;
    }
    .search-wrap input:focus { border-color: var(--brand); }
    .search-icon {
      position: absolute;
      left: .75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    select {
      padding: .65rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: .88rem;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      outline: none;
      min-width: 150px;
    }
    select:focus { border-color: var(--brand); }

    .results-count {
      font-size: .85rem;
      color: var(--muted);
      margin-left: auto;
      white-space: nowrap;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.25rem;
    }

    /* ── Partner card ── */
    .partner-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: .9rem;
      border: 1.5px solid transparent;
      transition: border .18s, box-shadow .18s, transform .18s;
      cursor: default;
    }
    .partner-card:hover {
      border-color: var(--brand);
      box-shadow: 0 8px 28px rgba(108,60,225,.15);
      transform: translateY(-2px);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: .75rem;
    }
    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--brand), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
    }
    .card-title h3 {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .card-title .loc {
      font-size: .78rem;
      color: var(--muted);
      margin-top: .2rem;
      display: flex;
      align-items: center;
      gap: .25rem;
    }

    .desc {
      font-size: .82rem;
      color: var(--muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem;
    }
    .tag {
      background: var(--tag-bg);
      color: var(--tag-fg);
      font-size: .73rem;
      padding: .2rem .55rem;
      border-radius: 99px;
      font-weight: 500;
    }

    .contact-row {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem .75rem;
      border-top: 1px solid var(--border);
      padding-top: .75rem;
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: .3rem;
      font-size: .78rem;
      color: var(--muted);
      text-decoration: none;
    }
    .contact-item:hover { color: var(--brand); }
    .contact-item svg { flex-shrink: 0; }

    .card-footer {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
    }
    .btn-link {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      padding: .4rem .8rem;
      border-radius: 6px;
      font-size: .77rem;
      font-weight: 600;
      text-decoration: none;
      transition: background .18s;
    }
    .btn-primary {
      background: var(--brand);
      color: #fff;
    }
    .btn-primary:hover { background: var(--brand-dk); }
    .btn-secondary {
      background: var(--tag-bg);
      color: var(--tag-fg);
    }
    .btn-secondary:hover { background: #ddd6fe; }

    /* ── Empty state ── */
    .empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }
    .empty svg { opacity: .3; margin-bottom: 1rem; }

    /* ── Loading ── */
    #loading {
      text-align: center;
      padding: 5rem;
      font-size: 1rem;
      color: var(--muted);
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 2rem;
      font-size: .8rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      margin-top: 3rem;
    }

    @media (max-width: 640px) {
      main { padding: 1rem; }
      .grid { grid-template-columns: 1fr; }
      .controls { flex-direction: column; }
      .results-count { margin-left: 0; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Go<span>Kwik</span> <span style="font-weight:400;font-size:1rem;opacity:.85">Partner Directory</span></div>
    <div class="header-sub">Shopify Ecosystem Partners &mdash; US Market</div>
  </div>
</header>

<main>
  <div id="loading">
    <div class="spinner"></div>
    Loading partner data&hellip;
  </div>

  <div id="app" style="display:none">
    <!-- Stats -->
    <div class="stats" id="stats"></div>

    <!-- Controls -->
    <div class="controls">
      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="search" placeholder="Search by name, description, location…" />
      </div>
      <select id="locationFilter"><option value="">All Locations</option></select>
      <select id="langFilter"><option value="">All Languages</option></select>
      <span class="results-count" id="resultsCount"></span>
    </div>

    <!-- Grid -->
    <div class="grid" id="grid"></div>
  </div>
</main>

<footer>
  &copy; 2025 GoKwik &mdash; Partnership Intelligence Dashboard &mdash; Data sourced from Shopify Partners Directory
</footer>

<script>
  let allPartners = [];

  function initials(name) {
    return name.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  }

  function icon(type) {
    const icons = {
      phone: `<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.64 12a19.79 19.79 0 0 1-3-8.59A2 2 0 0 1 3.59 1.5h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9a16 16 0 0 0 6 6l.92-.92a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,
      email: `<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`,
      web:   `<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,
      link:  `<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`,
      loc:   `<svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
    };
    return icons[type] || '';
  }

  function renderCard(p) {
    const name  = p.name  || 'Unknown';
    const desc  = p.description || '';
    const loc   = p.location && p.location !== 'NO DATA' ? p.location : '';
    const langs = p.Languages && p.Languages !== 'NO DATA' ? p.Languages : '';
    const tel   = p.tel   && p.tel   !== 'NO DATA' ? p.tel   : '';
    const email = p.email && p.email !== 'NO DATA' ? p.email : '';
    const web   = p.website && p.website !== 'NO DATA' ? p.website : '';
    const li    = p.linkedin && p.linkedin !== 'NO DATA' ? p.linkedin : '';
    const url   = p.url   || '';

    const langTags = langs ? langs.split(',').map(l =>
      `<span class="tag">${l.trim()}</span>`).join('') : '';

    const contacts = [
      tel   ? `<a class="contact-item" href="tel:${tel}">${icon('phone')}${tel}</a>` : '',
      email ? `<a class="contact-item" href="mailto:${email}">${icon('email')}${email}</a>` : '',
      web   ? `<a class="contact-item" href="${web}" target="_blank" rel="noopener">${icon('web')}Website</a>` : '',
    ].filter(Boolean).join('');

    const btns = [
      url ? `<a class="btn-link btn-primary" href="${url}" target="_blank" rel="noopener">${icon('link')} Shopify Profile</a>` : '',
      li  ? `<a class="btn-link btn-secondary" href="${li}" target="_blank" rel="noopener">LinkedIn</a>` : '',
    ].filter(Boolean).join('');

    return `
    <div class="partner-card">
      <div class="card-top">
        <div class="avatar">${initials(name)}</div>
        <div class="card-title">
          <h3>${escHtml(name)}</h3>
          ${loc ? `<div class="loc">${icon('loc')} ${escHtml(loc)}</div>` : ''}
        </div>
      </div>
      ${desc ? `<p class="desc">${escHtml(desc)}</p>` : ''}
      ${langTags ? `<div class="tags">${langTags}</div>` : ''}
      ${contacts ? `<div class="contact-row">${contacts}</div>` : ''}
      ${btns ? `<div class="card-footer">${btns}</div>` : ''}
    </div>`;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function getLocations(data) {
    const set = new Set();
    data.forEach(p => {
      if (p.location && p.location !== 'NO DATA') {
        const country = p.location.split(',').pop().trim();
        if (country) set.add(country);
      }
    });
    return [...set].sort();
  }

  function getLanguages(data) {
    const set = new Set();
    data.forEach(p => {
      if (p.Languages && p.Languages !== 'NO DATA') {
        p.Languages.split(',').forEach(l => set.add(l.trim()));
      }
    });
    return [...set].sort();
  }

  function renderStats(data) {
    const locations = new Set(data.map(p => p.location && p.location !== 'NO DATA' ? p.location.split(',').pop().trim() : null).filter(Boolean));
    const langs     = new Set(data.flatMap(p => p.Languages && p.Languages !== 'NO DATA' ? p.Languages.split(',').map(l => l.trim()) : []));
    const withEmail = data.filter(p => p.email && p.email !== 'NO DATA').length;

    document.getElementById('stats').innerHTML = `
      <div class="stat-card"><div class="val">${data.length}</div><div class="lbl">Total Partners</div></div>
      <div class="stat-card"><div class="val">${locations.size}</div><div class="lbl">Countries</div></div>
      <div class="stat-card"><div class="val">${withEmail}</div><div class="lbl">With Email</div></div>
      <div class="stat-card"><div class="val">${langs.size}</div><div class="lbl">Languages</div></div>
    `;
  }

  function populateFilters(data) {
    const locSel  = document.getElementById('locationFilter');
    const langSel = document.getElementById('langFilter');
    getLocations(data).forEach(l => {
      const o = document.createElement('option');
      o.value = l; o.textContent = l;
      locSel.appendChild(o);
    });
    getLanguages(data).forEach(l => {
      const o = document.createElement('option');
      o.value = l; o.textContent = l;
      langSel.appendChild(o);
    });
  }

  function filterAndRender() {
    const q    = document.getElementById('search').value.toLowerCase();
    const loc  = document.getElementById('locationFilter').value;
    const lang = document.getElementById('langFilter').value;

    let results = allPartners.filter(p => {
      const matchQ = !q || [p.name, p.description, p.location, p.Languages]
        .some(f => f && f.toLowerCase().includes(q));
      const matchLoc  = !loc  || (p.location && p.location.toLowerCase().includes(loc.toLowerCase()));
      const matchLang = !lang || (p.Languages && p.Languages.includes(lang));
      return matchQ && matchLoc && matchLang;
    });

    const grid = document.getElementById('grid');
    document.getElementById('resultsCount').textContent =
      `${results.length} partner${results.length !== 1 ? 's' : ''}`;

    if (results.length === 0) {
      grid.innerHTML = `<div class="empty">
        <svg width="64" height="64" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <p>No partners match your filters.</p>
      </div>`;
    } else {
      grid.innerHTML = results.map(renderCard).join('');
    }
  }

  // Load CSV
  Papa.parse('data.csv', {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete(results) {
      allPartners = results.data;

      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';

      renderStats(allPartners);
      populateFilters(allPartners);
      filterAndRender();

      ['search','locationFilter','langFilter'].forEach(id =>
        document.getElementById(id).addEventListener('input', filterAndRender));
    },
    error() {
      document.getElementById('loading').innerHTML =
        '<p style="color:#ef4444">Failed to load partner data. Make sure data.csv is accessible.</p>';
    }
  });
</script>
</body>
</html>
